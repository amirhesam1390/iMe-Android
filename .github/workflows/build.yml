name: Build iMe APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for SDK tools)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-28 build-tools;28.0.3'

      # === مرحله جدید: پاک کردن پلتفرم‌ها و build-tools جدیدتر ===
      - name: Clean newer SDK platforms and build-tools
        run: |
          cd $ANDROID_HOME
          echo "Before cleanup:"
          ls platforms || true
          ls build-tools || true
          
          # حذف هر پلتفرمی که android-28 نیست
          find platforms -maxdepth 1 -type d ! -name 'platforms' ! -name 'android-28' -exec rm -rf {} + 2>/dev/null || true
          
          # حذف هر build-toolی که 28.0.3 نیست
          find build-tools -maxdepth 1 -type d ! -name 'build-tools' ! -name '28.0.3' -exec rm -rf {} + 2>/dev/null || true
          
          echo "After cleanup:"
          ls platforms || true
          ls build-tools || true

      - name: Set up JDK 8 (for build)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore

      - name: Create google-services.json (placeholder)
        run: |
          cat > TMessagesProj/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "org.telegram.messenger"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly00000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iMe-Release-APK
          path: TMessagesProj/build/outputs/apk/release/*.apk
