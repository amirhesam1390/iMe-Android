name: Build iMe APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (for SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-28 build-tools;28.0.3'

      - name: Clean newer SDK platforms and build-tools
        run: |
          cd $ANDROID_HOME
          echo "Before cleanup:"
          ls platforms || true
          ls build-tools || true
          find platforms -maxdepth 1 -type d ! -name 'platforms' ! -name 'android-28' -exec rm -rf {} + 2>/dev/null || true
          find build-tools -maxdepth 1 -type d ! -name 'build-tools' ! -name '28.0.3' -exec rm -rf {} + 2>/dev/null || true
          echo "After cleanup:"
          ls platforms || true
          ls build-tools || true

      - name: Install NDK 22.1.7171670
        run: |
          yes | sdkmanager "ndk;22.1.7171670"
          echo "NDK installed at:"
          ls -la $ANDROID_HOME/ndk/ || true

      - name: Fix NDK platforms and toolchains directories
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/22.1.7171670"
          echo "NDK_PATH=$NDK_PATH"
          ls -la "$NDK_PATH" || true
          mkdir -p "$NDK_PATH/platforms/android-28"
          mkdir -p "$NDK_PATH/platforms/android-21"
          mkdir -p "$NDK_PATH/platforms/android-16"
          # Gradle 5.4.1 همچنین به toolchains نیاز دارد
          if [ ! -d "$NDK_PATH/toolchains" ]; then
            echo "WARNING: toolchains directory not found, creating empty one"
            mkdir -p "$NDK_PATH/toolchains"
          fi
          ls -la "$NDK_PATH/platforms"
          echo "ndk.dir=$NDK_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          cat local.properties

      - name: Setup Java 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore

      - name: Create google-services.json placeholder
        run: |
          cat > TMessagesProj/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "org.telegram.messenger"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly00000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iMe-Release-APK
          path: TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: warn
